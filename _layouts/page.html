---
layout: default
---
<div class="wrap page-shell">
  <header class="page-heading">
    <p class="eyebrow">{{ page.eyebrow | default: site.data.site.name }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.summary %}
      <p class="page-summary">{{ page.summary }}</p>
    {% endif %}
  </header>
  <div class="page-content">{{ content }}</div>
</div>
