---
layout: default
---
<article class="wrap article-shell">
  <a class="back-link" href="{{ '/news/' | relative_url }}">← Lab news</a>
  <p class="eyebrow">{{ page.date | date: '%d %B %Y' }}</p>
  <h1 class="article-title">{{ page.title }}</h1>
  {% if page.image -%}
    <img
      class="news-image"
      src="{{ page.image | relative_url }}"
      alt="{{ page.image_alt | default: page.title | escape }}"
    >
  {%- endif %}
  <div class="prose">{{ content }}</div>
</article>
