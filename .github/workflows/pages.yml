name: Build and publish GitHub Pages
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    # Publish the repository's default branch, whether named main or master.
    # Pull requests run checks without deploying; other branches are skipped.
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.8'
          bundler-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/validate_content.py
      - run: python -m unittest discover -s tests -v
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        env:
          JEKYLL_ENV: production
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
        run: |
          python -c 'import json, os; json.dump({"url": os.environ.get("PAGES_ORIGIN") or "https://kojetinlab.github.io"}, open(os.environ["RUNNER_TEMP"] + "/pages-config.yml", "w"))'
          bundle exec jekyll build --config "_config.yml,$RUNNER_TEMP/pages-config.yml" --baseurl "${PAGES_BASE:-}"
          python scripts/check_site.py _site --baseurl "${PAGES_BASE:-}"
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
