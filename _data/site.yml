headline: "Structure.<br>Dynamics.<br><span>Function.</span>"
intro: We explore how nuclear receptors sense small molecules and regulate gene expression.
mission: We study the molecular mechanisms of nuclear receptor function. By connecting protein structure, conformational dynamics, and pharmacology, we seek to understand how ligands and protein interactions shape transcriptional regulation.
