# Molecular identity and orientation live in _data/structures.yml.
presentation:
  enable_rotation: true
  # Legacy names: these control approach into the bound pose.
  # false = fade in at the binding site without translation.
  enable_peptide_separation: true
  enable_ligand_separation: true
  enable_labels: true
  # Drawing pixels per CSS pixel, capped at the device's own pixel density.
  # Mobile means the narrow layout (700 px or less). Try 2 if 3 feels slow.
  max_pixel_ratio: 1.7
  mobile_max_pixel_ratio: 3.0
  # Noticeable, smooth motion during “Beyond a single structure”.
  # Mol* procedural wiggle is illustrative, not an MD trajectory.
  enable_domain_motion: true
  domain_motion_degrees: 3.5
  domain_motion_period_seconds: 3.2
  # Applies to receptor, peptide, and ligand together. Set to 0 for rocking alone.
  # Larger amplitudes give more internal flex.
  domain_wiggle_amplitude_angstroms: 2.0
  domain_wiggle_speed: 3.5
  # Lower spatial frequency makes neighboring regions move more coherently.
  domain_wiggle_frequency: 0.12
