<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">

<meta property="og:image"
      content="{{ page.social_preview_image | default: site.social_preview_image | absolute_url }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image"
      content="{{ page.social_preview_image | default: site.social_preview_image | absolute_url }}">

<header class="site-header">
  <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Kojetin Laboratory home">
    kojetin
    <span>laboratory</span>
    <i aria-hidden="true"></i>
  </a>
  <button class="menu-toggle" aria-expanded="false" aria-controls="navigation" hidden>
    Menu
    <span aria-hidden="true">＋</span>
  </button>
  <nav id="navigation" aria-label="Main navigation">
    {% for item in site.data.navigation -%}
      <a
        href="{{ item.url | relative_url }}"
        {% if page.url contains item.url %}
          aria-current="page"
        {% endif %}
      >
        {{- item.title -}}
      </a>
    {%- endfor %}
    {% include display-controls.html %}
  </nav>
</header>
